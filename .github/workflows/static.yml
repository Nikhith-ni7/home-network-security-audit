<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Network Security Audit · Nikhith</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0a0c0f;
  --bg2: #111418;
  --bg3: #181c22;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --muted: #6b7280;
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --amber: #f59e0b;
  --amber-bg: rgba(245,158,11,0.1);
  --green: #10b981;
  --green-bg: rgba(16,185,129,0.1);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.1);
  --accent: #00d4aa;
  --accent2: #0a0c0f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#000}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(10,12,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:.05em}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{font-size:12px;color:var(--muted);text-decoration:none;font-family:'JetBrains Mono',monospace;transition:color .2s}
.nav-links a:hover{color:var(--text)}

/* HERO */
.hero{padding:5rem 2rem 3rem;max-width:1100px;margin:0 auto}
.hero-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.hero-tag::before{content:'';width:20px;height:1px;background:var(--accent)}
h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-bottom:1rem}
h1 span{color:var(--accent)}
.hero-meta{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.5rem}
.meta-chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);padding:4px 12px;border-radius:4px}

/* STAT ROW */
.stat-section{padding:0 2rem 2rem;max-width:1100px;margin:0 auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.stat-item{background:var(--bg2);padding:1.5rem;text-align:center}
.stat-num{font-size:2.5rem;font-weight:800;line-height:1;margin-bottom:4px}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.s-red{color:var(--red)}
.s-amber{color:var(--amber)}
.s-green{color:var(--green)}
.s-blue{color:var(--blue)}
.s-accent{color:var(--accent)}

/* MAIN CONTENT */
.content{padding:0 2rem 4rem;max-width:1100px;margin:0 auto}
.section-head{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.15em;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.section-head::after{content:'';flex:1;height:1px;background:var(--border)}
h2{font-size:1.4rem;font-weight:700;margin-bottom:1.5rem}

/* DEVICE TABLE */
.device-table{width:100%;border-collapse:collapse;margin-bottom:3rem}
.device-table th{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.device-table td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.device-table tr:hover td{background:var(--bg3)}
.device-table tr:last-child td{border-bottom:none}
code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg3);padding:2px 6px;border-radius:4px;color:var(--accent)}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.05em}
.b-critical{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.b-medium{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,0.2)}
.b-low{background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.b-info{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,0.2)}

/* PORT MAP */
.port-map{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:3rem}
.port-host{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;min-width:180px;flex:1}
.port-host-ip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:8px}
.port-chips{display:flex;flex-wrap:wrap;gap:4px}
.pchip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:3px;border:1px solid}
.pchip-open{background:rgba(16,185,129,.08);color:var(--green);border-color:rgba(16,185,129,.25)}
.pchip-critical{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.25)}
.pchip-filtered{background:rgba(245,158,11,.08);color:var(--amber);border-color:rgba(245,158,11,.25)}

/* FINDINGS */
.findings{display:flex;flex-direction:column;gap:12px;margin-bottom:3rem}
.finding-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.25rem;position:relative;overflow:hidden;transition:border-color .2s}
.finding-card:hover{border-color:var(--border2)}
.finding-card.critical{border-left:3px solid var(--red)}
.finding-card.medium{border-left:3px solid var(--amber)}
.finding-card.low{border-left:3px solid var(--green)}
.finding-card.info{border-left:3px solid var(--blue)}
.finding-header{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;flex-wrap:wrap}
.finding-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.finding-title{font-size:15px;font-weight:700;flex:1}
.finding-body{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:.75rem}
.finding-fix{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:.75rem 1rem}
.finding-fix-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
.finding-fix pre{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);white-space:pre-wrap;line-height:1.6}

/* CHART */
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:3rem}
.chart-inner{position:relative;height:260px}

/* RECS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:3rem}
.rec-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.25rem;transition:border-color .2s}
.rec-card:hover{border-color:var(--border2)}
.rec-priority{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}
.rec-title{font-size:14px;font-weight:700;margin-bottom:.5rem}
.rec-desc{font-size:12px;color:var(--muted);line-height:1.6}

/* METHODOLOGY */
.method-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:3rem}
.method-step{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.step-num{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:700;color:var(--border2);margin-bottom:.5rem}
.step-title{font-size:14px;font-weight:700;margin-bottom:.25rem}
.step-cmd{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:.5rem}

/* SECURE */
.secure-list{display:flex;flex-direction:column;gap:8px;margin-bottom:3rem}
.secure-item{display:flex;align-items:flex-start;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem}
.secure-check{color:var(--green);font-size:16px;flex-shrink:0;margin-top:1px}
.secure-text{font-size:13px;color:var(--muted);line-height:1.6}
.secure-text strong{color:var(--text)}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2rem;text-align:center}
footer p{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);line-height:2}
footer a{color:var(--accent);text-decoration:none}

/* ANIMATIONS */
.fade-in{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.fade-in.visible{opacity:1;transform:none}

@media(max-width:600px){
  nav .nav-links{display:none}
  h1{font-size:1.8rem}
  .device-table{font-size:12px}
  .device-table td:nth-child(3){display:none}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">~/network-audit</div>
  <div class="nav-links">
    <a href="#findings">Findings</a>
    <a href="#ports">Port map</a>
    <a href="#recs">Recommendations</a>
    <a href="#method">Methodology</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag">Security audit · Lab report</div>
  <h1>Home Network<br><span>Vulnerability</span> Assessment</h1>
  <p style="font-size:15px;color:var(--muted);max-width:550px;line-height:1.7">Passive reconnaissance performed on a personal home LAN. No configurations changed. No exploitation performed. Goal: identify exposed services and document risk.</p>
  <div class="hero-meta">
    <span class="meta-chip">Scope: 10.0.0.0/24</span>
    <span class="meta-chip">Tool: Nmap 7.94SVN</span>
    <span class="meta-chip">Hosts up: 10 / 256</span>
    <span class="meta-chip">Date: May 21, 2026</span>
    <span class="meta-chip">Scan time: 52s</span>
  </div>
</div>

<div class="stat-section fade-in">
  <div class="stat-grid">
    <div class="stat-item"><div class="stat-num s-accent">10</div><div class="stat-lbl">Hosts found</div></div>
    <div class="stat-item"><div class="stat-num s-red">1</div><div class="stat-lbl">Critical</div></div>
    <div class="stat-item"><div class="stat-num s-amber">3</div><div class="stat-lbl">Medium</div></div>
    <div class="stat-item"><div class="stat-num s-green">2</div><div class="stat-lbl">Low</div></div>
    <div class="stat-item"><div class="stat-num s-blue">4</div><div class="stat-lbl">Informational</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--muted)">9</div><div class="stat-lbl">Open ports</div></div>
  </div>
</div>

<div class="content">

  <div class="section-head" style="margin-top:2rem">Device inventory</div>
  <h2>Network hosts</h2>
  <div style="overflow-x:auto;margin-bottom:3rem">
  <table class="device-table">
    <thead>
      <tr>
        <th>IP Address</th>
        <th>Device</th>
        <th>Open ports</th>
        <th>OS / Vendor</th>
        <th>Risk</th>
      </tr>
    </thead>
    <tbody>
      <tr><td><code>10.0.0.1</code></td><td>Xfinity Router</td><td><code>53</code> <code>80</code> <code>443</code></td><td>Technicolor · Linux 5.x</td><td><span class="badge b-medium">Medium</span></td></tr>
      <tr><td><code>10.0.0.5</code></td><td>IP Camera #1</td><td><code>443</code> <code>554</code></td><td>Unknown vendor</td><td><span class="badge b-medium">Medium</span></td></tr>
      <tr><td><code>10.0.0.90</code></td><td>IP Camera #2</td><td><code>5000</code></td><td>Unknown vendor</td><td><span class="badge b-medium">Medium</span></td></tr>
      <tr><td><code>10.0.0.220</code></td><td>Windows PC</td><td><code>3306</code></td><td>Intel NIC · Windows 11</td><td><span class="badge b-critical">Critical</span></td></tr>
      <tr><td><code>10.0.0.81</code></td><td>Xiaomi Phone</td><td>None</td><td>Xiaomi Communications</td><td><span class="badge b-low">Secure</span></td></tr>
      <tr><td><code>10.0.0.71</code></td><td>Unknown device</td><td><code>49152</code></td><td>Unknown</td><td><span class="badge b-info">Info</span></td></tr>
      <tr><td><code>10.0.0.58</code></td><td>Unknown device</td><td>None visible</td><td>AzureWave NIC</td><td><span class="badge b-info">Info</span></td></tr>
      <tr><td><code>10.0.0.120</code></td><td>Unknown device</td><td>None visible</td><td>Unknown</td><td><span class="badge b-info">Info</span></td></tr>
      <tr><td><code>10.0.0.144</code></td><td>Unknown device</td><td>None visible</td><td>Intel NIC</td><td><span class="badge b-info">Info</span></td></tr>
      <tr><td><code>10.0.0.10</code></td><td>Local host</td><td>None</td><td>—</td><td><span class="badge b-low">Low</span></td></tr>
    </tbody>
  </table>
  </div>

  <div id="ports" class="section-head">Port map</div>
  <h2>Open services</h2>
  <div class="port-map">
    <div class="port-host">
      <div class="port-host-ip">10.0.0.1 — Router</div>
      <div class="port-chips">
        <span class="pchip pchip-open">53 dns</span>
        <span class="pchip pchip-open">80 http</span>
        <span class="pchip pchip-open">443 https</span>
        <span class="pchip pchip-filtered">22 filtered</span>
        <span class="pchip pchip-filtered">23 filtered</span>
        <span class="pchip pchip-filtered">8080 filtered</span>
      </div>
    </div>
    <div class="port-host">
      <div class="port-host-ip">10.0.0.5 — Camera #1</div>
      <div class="port-chips">
        <span class="pchip pchip-open">443 https</span>
        <span class="pchip pchip-open">554 rtsp</span>
      </div>
    </div>
    <div class="port-host">
      <div class="port-host-ip">10.0.0.90 — Camera #2</div>
      <div class="port-chips">
        <span class="pchip pchip-open">5000 rtsp</span>
      </div>
    </div>
    <div class="port-host">
      <div class="port-host-ip">10.0.0.220 — Windows PC</div>
      <div class="port-chips">
        <span class="pchip pchip-critical">3306 mysql !</span>
      </div>
    </div>
    <div class="port-host">
      <div class="port-host-ip">10.0.0.71 — Unknown</div>
      <div class="port-chips">
        <span class="pchip pchip-open">49152 tcp</span>
      </div>
    </div>
  </div>

  <div id="findings" class="section-head">Findings</div>
  <h2>Vulnerability details</h2>
  <div class="findings">

    <div class="finding-card critical fade-in">
      <div class="finding-header">
        <span class="finding-id">F-01</span>
        <span class="badge b-critical">Critical</span>
        <span class="finding-title">MySQL database exposed on LAN</span>
        <code style="font-size:11px">10.0.0.220:3306</code>
      </div>
      <div class="finding-body">MySQL port 3306 is reachable from any device on the LAN. Nmap flagged the response as <em>unauthorized</em> — meaning the service responds and identifies itself before any authentication occurs. Any host on the network can attempt a direct connection to the database engine. This is the highest-risk finding in this audit.</div>
      <div class="finding-fix">
        <div class="finding-fix-label">Remediation</div>
        <pre># Bind MySQL to localhost only
# Edit: /etc/mysql/mysql.conf.d/mysqld.cnf
bind-address = 127.0.0.1

# Or block via firewall
sudo ufw deny 3306</pre>
      </div>
    </div>

    <div class="finding-card medium fade-in">
      <div class="finding-header">
        <span class="finding-id">F-02</span>
        <span class="badge b-medium">Medium</span>
        <span class="finding-title">Unauthenticated RTSP camera streams</span>
        <code style="font-size:11px">10.0.0.5:554 · 10.0.0.90:5000</code>
      </div>
      <div class="finding-body">Both IP cameras expose RTSP streams on the LAN with no confirmed authentication layer. RTSP (Real Time Streaming Protocol) is used for live video — an unauthenticated stream means any device on the network can potentially view the live feed without credentials.</div>
      <div class="finding-fix">
        <div class="finding-fix-label">Remediation</div>
        <pre># Enable RTSP authentication in camera admin panel
# Set a strong unique password per camera
# Isolate cameras on a dedicated IoT VLAN</pre>
      </div>
    </div>

    <div class="finding-card medium fade-in">
      <div class="finding-header">
        <span class="finding-id">F-03</span>
        <span class="badge b-medium">Medium</span>
        <span class="finding-title">dnsmasq 2.83 — known CVEs</span>
        <code style="font-size:11px">10.0.0.1:53</code>
      </div>
      <div class="finding-body">The Xfinity router runs dnsmasq version 2.83 which has publicly documented CVEs. While telnet (23) and SSH (22) are correctly filtered and HTTP security headers are present, the DNS service version should be patched via a firmware update.</div>
      <div class="finding-fix">
        <div class="finding-fix-label">Remediation</div>
        <pre># Check for firmware update via router admin panel
# http://10.0.0.1 → Administration → Firmware Update
# Or contact Xfinity support for latest firmware</pre>
      </div>
    </div>

    <div class="finding-card info fade-in">
      <div class="finding-header">
        <span class="finding-id">F-04</span>
        <span class="badge b-info">Info</span>
        <span class="finding-title">4 unidentified hosts on network</span>
        <code style="font-size:11px">.58 · .71 · .120 · .144</code>
      </div>
      <div class="finding-body">Four hosts responded to ping but most ports were filtered or closed in the top-100 scan. One host (.71) exposes port 49152 (tcpwrapped — common on Apple/Windows UPnP). Full identification requires a deeper scan across all 65535 ports.</div>
      <div class="finding-fix">
        <div class="finding-fix-label">Next step</div>
        <pre>nmap -p- -T4 -sV 10.0.0.58
nmap -p- -T4 -sV 10.0.0.71</pre>
      </div>
    </div>

  </div>

  <div class="section-head">Risk distribution</div>
  <h2>Finding breakdown</h2>
  <div class="chart-wrap fade-in">
    <div class="chart-inner">
      <canvas id="riskChart" role="img" aria-label="Bar chart: 1 critical, 3 medium, 2 low, 4 informational findings">Risk: 1 critical, 3 medium, 2 low, 4 info.</canvas>
    </div>
  </div>

  <div class="section-head">What was secure</div>
  <h2>Positive findings</h2>
  <div class="secure-list">
    <div class="secure-item"><span class="secure-check">✓</span><div class="secure-text"><strong>Xiaomi phone (10.0.0.81)</strong> — All 100 scanned ports closed. Device firewall functioning correctly. No attack surface exposed.</div></div>
    <div class="secure-item"><span class="secure-check">✓</span><div class="secure-text"><strong>Router filtered ports</strong> — SSH (22) and Telnet (23) are filtered, not open. Reduces remote management exposure significantly.</div></div>
    <div class="secure-item"><span class="secure-check">✓</span><div class="secure-text"><strong>Router HTTP security headers</strong> — X-Frame-Options, X-XSS-Protection, Content-Security-Policy, and Strict-Transport-Security all present on port 80/443.</div></div>
    <div class="secure-item"><span class="secure-check">✓</span><div class="secure-text"><strong>Most devices minimal footprint</strong> — Devices on .58, .120, .144 show no open ports in top-100 scan, suggesting reasonable host-based firewalling.</div></div>
  </div>

  <div id="recs" class="section-head">Recommendations</div>
  <h2>Remediation plan</h2>
  <div class="rec-grid">
    <div class="rec-card">
      <div class="rec-priority" style="color:var(--red)">Immediate</div>
      <div class="rec-title">Block MySQL from LAN</div>
      <div class="rec-desc">Bind MySQL to 127.0.0.1 or add a UFW rule. Port 3306 should never be reachable from the network.</div>
    </div>
    <div class="rec-card">
      <div class="rec-priority" style="color:var(--amber)">High</div>
      <div class="rec-title">Enable camera auth</div>
      <div class="rec-desc">Set strong credentials on both RTSP streams via each camera's admin interface.</div>
    </div>
    <div class="rec-card">
      <div class="rec-priority" style="color:var(--amber)">High</div>
      <div class="rec-title">Update router firmware</div>
      <div class="rec-desc">Patch dnsmasq CVEs via Xfinity admin panel. Check for available firmware updates.</div>
    </div>
    <div class="rec-card">
      <div class="rec-priority" style="color:var(--green)">Medium</div>
      <div class="rec-title">VLAN segmentation</div>
      <div class="rec-desc">Isolate IoT cameras onto a dedicated VLAN to limit lateral movement if compromised.</div>
    </div>
    <div class="rec-card">
      <div class="rec-priority" style="color:var(--blue)">Low</div>
      <div class="rec-title">Full port scan</div>
      <div class="rec-desc">Run nmap -p- on 4 unidentified devices to complete the network inventory.</div>
    </div>
  </div>

  <div id="method" class="section-head">Methodology</div>
  <h2>How this was done</h2>
  <div class="method-steps">
    <div class="method-step fade-in">
      <div class="step-num">01</div>
      <div class="step-title">Host discovery</div>
      <div class="rec-desc" style="font-size:12px">Ping sweep across the full /24 subnet to identify live hosts.</div>
      <div class="step-cmd">nmap -sn 10.0.0.0/24</div>
    </div>
    <div class="method-step fade-in">
      <div class="step-num">02</div>
      <div class="step-title">Port + service scan</div>
      <div class="rec-desc" style="font-size:12px">Top-100 port scan with service and OS detection on all live hosts.</div>
      <div class="step-cmd">nmap -sV -O --top-ports 100</div>
    </div>
    <div class="method-step fade-in">
      <div class="step-num">03</div>
      <div class="step-title">Analysis</div>
      <div class="rec-desc" style="font-size:12px">Manual review of service fingerprints, banner grabbing, and CVE lookup per service version.</div>
      <div class="step-cmd">Manual · CVE database</div>
    </div>
    <div class="method-step fade-in">
      <div class="step-num">04</div>
      <div class="step-title">Report</div>
      <div class="rec-desc" style="font-size:12px">Risk rating per device using Critical / Medium / Low / Info scale. Remediation steps documented.</div>
      <div class="step-cmd">CVSS-inspired rating</div>
    </div>
  </div>

  <div class="section-head">Disclaimer</div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:3rem">
    <p style="font-size:13px;color:var(--muted);line-height:1.8">This audit was performed on a personal home network for educational purposes as part of a security lab exercise. All devices on this network are owned by the author. No unauthorized access was attempted or achieved. No device configurations were modified. This report documents passive reconnaissance findings only.</p>

  </div>

</div>

<footer>
  <p>Home Network Security Audit · Passive recon only · No exploitation performed<br>
  <a href="https://github.com">View on GitHub</a></p>
</footer>

<script>
new Chart(document.getElementById('riskChart'),{
  type:'bar',
  data:{
    labels:['Critical','Medium','Low','Informational'],
    datasets:[{
      data:[1,3,2,4],
      backgroundColor:['rgba(239,68,68,0.8)','rgba(245,158,11,0.8)','rgba(16,185,129,0.8)','rgba(59,130,246,0.8)'],
      borderColor:['#ef4444','#f59e0b','#10b981','#3b82f6'],
      borderWidth:1,
      borderRadius:6,
      borderSkipped:false
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw} finding${ctx.raw!==1?'s':''}`},backgroundColor:'#111418',borderColor:'rgba(255,255,255,0.07)',borderWidth:1,titleColor:'#e8eaf0',bodyColor:'#6b7280'}},
    scales:{
      x:{grid:{display:false},ticks:{color:'#6b7280',font:{size:12,family:'JetBrains Mono'}}},
      y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b7280',font:{size:11,family:'JetBrains Mono'},stepSize:1},beginAtZero:true,max:5}
    }
  }
});

const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}})
},{threshold:0.1});
document.querySelectorAll('.fade-in').forEach(el=>observer.observe(el));
</script>
</body>
</html>
